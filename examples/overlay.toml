# Example private overlay — internal nodes and relationship edges.
# In a real deployment this file is kept private (never committed to a public
# repo) and merged in at `myco build` time.

# Repos known to intentionally lack a mycelium.toml — suppressed from the audit's
# orphan list. Match by the canonical id printed by `myco audit`; a full remote
# URL works too (it is canonicalized).
ignore = ["github.com/acme/scratch"]

[[node]]
name     = "shared-postgres"
summary  = "Shared Postgres instance"
provides = ["postgres"]

[[edge]]
from = "orders-api"
to   = "postgres"
type = "consumes"

[[edge]]
from = "orders-api"
to   = "shared-lib"
type = "depends-on"

[[edge]]
from = "billing-web"
to   = "order-events"
type = "consumes"

[[edge]]
from = "billing-web"
to   = "shared-lib"
type = "depends-on"
