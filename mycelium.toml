name    = "mycelium"
summary = "A cross-repo ecosystem map for agents. Each repo carries a small mycelium.toml describing what it is and what it provides; mycelium merges them into one graph an agent reads to discover the repos, services and capabilities around it."
kind    = "tool"
status  = "wip"
tags    = ["graph", "agents", "metadata", "cli"]
stack   = ["go"]

[[provides]]
name    = "ecosystem-graph"
summary = "Serves the merged ecosystem graph as MAP.md + graph.json over HTTP"
